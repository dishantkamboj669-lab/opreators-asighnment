<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Clock</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background-color: #101719;
            background-image:
                linear-gradient(rgba(135, 164, 157, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(135, 164, 157, 0.035) 1px, transparent 1px),
                radial-gradient(ellipse at center, #243330 0%, #101719 72%);
            background-size: 32px 32px, 32px 32px, auto;
            font-family: 'Courier New', monospace;
        }

        #clock {
            width: min(100%, 560px);
            box-sizing: border-box;
            padding: 28px 36px 32px;
            border: 1px solid #53645c;
            border-radius: 8px;
            background: linear-gradient(145deg, #1d2825, #111817 72%);
            color: #c9f7a5;
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.2;
            text-align: center;
            text-shadow: 0 0 8px rgba(184, 255, 133, 0.8), 0 0 24px rgba(147, 231, 119, 0.32);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42), inset 0 0 24px rgba(164, 219, 157, 0.04);
        }

        #clock::before {
            content: 'DIGITAL CLOCK';
            display: block;
            margin-bottom: 18px;
            color: #91a59a;
            font-size: 12px;
            font-weight: normal;
            letter-spacing: 4px;
            text-shadow: none;
        }

        @media (max-width: 480px) {
            #clock {
                padding: 24px 14px 28px;
                font-size: 42px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>
    
        <div id="clock"></div>
    

    <script>
       function clock(){
        time = new Date();
        h= time.getHours();
        m = time.getMinutes();
        s = time.getSeconds();

        document.getElementById("clock").innerText = h+":"+m+":"+s ;

        setTimeout(clock,1000);
       }
       clock();
    </script>
</body>
</html>
