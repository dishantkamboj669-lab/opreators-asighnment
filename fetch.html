<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>data fetch</title>

</head>
<body>
    

    <div id="box"></div>


    <script>

        // first 1

        // fetch("https://jsonplaceholder.typicode.com/users")
        // .then(res=>res.json())
        // .then(data=>console.log(data))
        // .catch(err=>console.log(err)
        // )



        // secound 2

        fetch("https://jsonplaceholder.typicode.com/users")
        .then(res=>res.json())
        .then(data=>document.getElementById("box").innerHTML=data.map((p)=>
        `<h1> ${p.name}</h1>
        <h1> ${p.phone}</h1>`
    
    ))
       
    </script>
</body>
</html>
