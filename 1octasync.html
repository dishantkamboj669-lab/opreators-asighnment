function clock(){
        time = new Date();
        h= time.getHours();
        m = time.getMinutes();
        s = time.getSecounds();

        document.getElementById("time").innerText = h+":"+m+":"+s ;

        setTimeout(clock,1000);
       }
       clock();
           
        
    </script>
